schema_version: "1.0"

metrics:
  - name: rise
    unit: s
    maestro_formula: riseTime(VT("/VOUT") 0 nil 0.9 nil 10 90 nil "time")
    required_signals:
      - /VOUT
    ocean:
      expression: riseTime(VT("/VOUT") 0 nil 0.9 nil 10 90 nil "time")
      result: tran
      expression_source: user_approved
      source_reference: template:spectre_maestro_project:rise
      expected_value_type: real_scalar
      nil_policy: fail
      non_finite_policy: fail

  - name: fall
    unit: s
    maestro_formula: fallTime(VT("/VOUT") 0.9 nil 0 nil 10 90 nil "time")
    required_signals:
      - /VOUT
    ocean:
      expression: fallTime(VT("/VOUT") 0.9 nil 0 nil 10 90 nil "time")
      result: tran
      expression_source: user_approved
      source_reference: template:spectre_maestro_project:fall
      expected_value_type: real_scalar
      nil_policy: fail
      non_finite_policy: fail

  - name: DC
    unit: W
    maestro_formula: VDC("/VDD") * IDC("/M0/S")
    required_signals:
      - /VDD
      - /M0/S
    ocean:
      expression: VDC("/VDD") * IDC("/M0/S")
      result: tran
      expression_source: user_approved
      source_reference: template:spectre_maestro_project:DC
      expected_value_type: real_scalar
      nil_policy: fail
      non_finite_policy: fail

constraints:
  - metric: rise
    op: lt
    value: "80e-12 s"

  - metric: fall
    op: lt
    value: "80e-12 s"

  - metric: DC
    op: lt
    value: "4e-4 W"

objective:
  direction: minimize
  expression: "(rise + fall) * DC"
